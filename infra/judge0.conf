# Judge0 CE configuration
# https://github.com/judge0/judge0/blob/master/.env.example

REDIS_HOST=judge0-redis
REDIS_PORT=6379

POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0password

# Security — leave AUTHN_HEADER/TOKEN blank for development
AUTHN_HEADER=X-Auth-Token
AUTHN_TOKEN=

# Execution limits
CPU_TIME_LIMIT=5
CPU_EXTRA_TIME=1
WALL_TIME_LIMIT=10
MEMORY_LIMIT=262144
STACK_LIMIT=65536
MAX_PROCESSES_AND_OR_THREADS=60
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=false
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=false
MAX_FILE_SIZE=4096
NUMBER_OF_RUNS=1

# Workers
RAILS_MAX_THREADS=5
