version: "3.9"

services:
  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: algomentor-postgres
    environment:
      POSTGRES_USER: algomentor
      POSTGRES_PASSWORD: algomentor
      POSTGRES_DB: algomentor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algomentor"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: algomentor-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Judge0 CE (self-hosted code execution sandbox) ────────────────────────
  # Architecture per AGENTS.md constraint #1 — all execution via sandbox adapter
  judge0-server:
    image: judge0/judge0:1.13.1
    container_name: algomentor-judge0-server
    volumes:
      - ./infra/judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy
    environment:
      REDIS_HOST: judge0-redis
      POSTGRES_HOST: judge0-db
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0password
    restart: unless-stopped

  judge0-worker:
    image: judge0/judge0:1.13.1
    container_name: algomentor-judge0-worker
    command: ["./scripts/run-worker.sh"]
    volumes:
      - ./infra/judge0.conf:/judge0.conf:ro
    privileged: true
    depends_on:
      - judge0-server
    environment:
      REDIS_HOST: judge0-redis
      POSTGRES_HOST: judge0-db
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0password
    restart: unless-stopped

  judge0-db:
    image: postgres:16-alpine
    container_name: algomentor-judge0-db
    environment:
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0password
      POSTGRES_DB: judge0
    volumes:
      - judge0_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge0"]
      interval: 10s
      timeout: 5s
      retries: 5

  judge0-redis:
    image: redis:7-alpine
    container_name: algomentor-judge0-redis
    volumes:
      - judge0_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  judge0_db_data:
  judge0_redis_data:
